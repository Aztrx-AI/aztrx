name: CI

# The repo's own gate. `aztrx-pr.yml` next to this file is a *template consumers
# call* (`on: workflow_call` only) — it never runs here, so before this file the
# 159-test suite only ran when a human typed `npm test`, and nothing stopped the
# engine from regressing.
#
# The matrix exists to check the version claim rather than assert it. Two things
# had drifted apart before this file: `package.json` declared `engines.node >=18`,
# but the Playwright this package depends on declares `>=20`, so the floor was
# never 18. And `npm test` used a quoted `tests/**` glob, which only expands on
# the Node versions that support globs in `--test` — the run died on 20 with
# "Could not find '.../tests/**/*.test.ts'". Both are now fixed, and 20/22/24 is
# what actually proves it.
#
# Node 20 is included deliberately even though it is past EOL: it is what
# `action.yml` pins, so it is the version this product ships to consumers and the
# one most worth protecting.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A force-push to a PR branch should cancel the superseded run, not queue
  # behind it — but never cancel a run on main, where the result is the record.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A failure on one version must not hide the result on the others — knowing
      # *which* versions pass is the whole point of the matrix.
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Pin the browser to the Playwright version aztrx itself depends on, so the
      # driver and the browser never drift apart. Same pin as action.yml:106.
      # The Vite-plugin test boots a real dev server and drives a real page.
      - run: npx --yes playwright@1.62.1 install --with-deps chromium

      - run: npm run typecheck

      # `pretest` builds dist/ first — the MCP tests spawn the built CLI.
      - run: npm test
