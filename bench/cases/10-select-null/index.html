<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../common.css"><title>Billing — Plan</title></head>
<body><div class="wrap">
  <h1>Billing</h1><p class="sub">Choose a plan</p>
  <div class="card"><h2>Plan</h2>
    <label>Plan
      <select id="plan">
        <option value="free">Free</option>
        <option value="pro">Pro</option>
        <option value="team">Team</option>
      </select>
    </label>
  </div>
</div>
<script>
  document.getElementById("plan").addEventListener("change", (e) => {
    if (e.target.value === "team") {
      throw new Error("Cannot read properties of undefined (reading 'seatCount')");
    }
  });
</script>
</body></html>
