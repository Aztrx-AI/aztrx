<!doctype html>
<!--
  The one fixture that reaches the LLM.

  Every other fixture here is a null/undefined deref, and `generateRulePatch`
  (src/core/heal/llm.ts) fixes those for free with no key — it keys on
  NULL_DEREF = /Cannot read properties of (undefined|null)/. So none of them
  exercise the model path at all, which made "the heal loop has never run
  against a real key" literally untestable: there was nothing to run it on.

  This bug is chosen because the rule declines it. `toFixed is not a function`
  is not a NULL_DEREF match, so healing falls through to the configured model.

  Run it:

    node fixtures/serve.mjs &
    node dist/cli.js http://localhost:8901/heal-llm.html --repo . --fix

  `--repo .` and not `--repo fixtures`: healing sandboxes the patch in a
  detached git worktree, and a worktree only contains committed files.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Invoice — Line total</title>
    <style>
      body {
        margin: 0;
        padding: 48px;
        background: #0b0b0c;
        color: #e7e7e8;
        font: 15px/1.6 ui-sans-serif, system-ui, sans-serif;
      }
      .card {
        max-width: 420px;
        padding: 24px;
        border: 1px solid #26262a;
        border-radius: 12px;
      }
      label { display: block; font-size: 13px; color: #9a9aa0; margin-bottom: 6px; }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #33333a;
        border-radius: 8px;
        background: #131316;
        color: #e7e7e8;
        font: inherit;
      }
      #total { margin-top: 18px; font-size: 22px; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 style="margin: 0 0 20px; font-size: 17px">Invoice — line total</h1>
      <label for="qty">Quantity</label>
      <input id="qty" type="text" placeholder="e.g. 3" />
      <p id="total">—</p>
    </div>
    <script>
      document.getElementById("qty").addEventListener("input", (e) => {
        // The bug: `.value` is always a string, and the formatter is applied to
        // it directly instead of to a parsed number — so `toFixed` is looked up
        // on a String and the handler throws. `Number(e.target.value)` is the
        // fix; the rule engine declines this because it is not a null deref.
        const qty = e.target.value;
        document.getElementById("total").textContent = "$" + qty.toFixed(2);
      });
    </script>
  </body>
</html>
